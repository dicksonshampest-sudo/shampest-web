<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="site-header" style="background:rgba(0,0,0,0.95);">
    <div class="container header-inner">
      <div class="logo"><a href="#"><span class="logo-icon">⚙</span><span class="logo-text">Admin</span></a></div>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html" class="active">Dashboard</a></li>
          <li><a href="songs.html">Songs</a></li>
          <li><a href="videos.html">Videos</a></li>
          <li><a href="photos.html">Photos</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="admin-container">
    <div class="admin-header">
      <h1>Dashboard</h1>
      <span>Welcome, Matthews</span>
    </div>
    <div class="admin-stats">
      <div class="stat-card"><div class="number">12</div><div class="label">Songs</div></div>
      <div class="stat-card"><div class="number">8</div><div class="label">Videos</div></div>
      <div class="stat-card"><div class="number">46</div><div class="label">Photos</div></div>
      <div class="stat-card"><div class="number">5</div><div class="label">Messages</div></div>
    </div>

    <div class="admin-form">
      <h3>Quick Add Song</h3>
      <form>
        <input type="text" placeholder="Song Title" required />
        <input type="file" accept="audio/*" />
        <input type="file" accept="image/*" placeholder="Cover Art" />
        <button type="submit">Upload Song</button>
      </form>
    </div>

    <h3>Recent Songs</h3>
    <table class="admin-table">
      <thead><tr><th>Title</th><th>Date</th><th>Actions</th></tr></thead>
      <tbody>
        <tr><td>Beautiful Love</td><td>2026-08-20</td><td><button class="btn-small">Edit</button> <button class="btn-small danger">Delete</button></td></tr>
        <tr><td>Midnight</td><td>2026-08-10</td><td><button class="btn-small">Edit</button> <button class="btn-small danger">Delete</button></td></tr>
      </tbody>
    </table>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
